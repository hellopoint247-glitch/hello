<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2232" />
    <!-- Apple Web App support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hello Point" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <!-- Web App Manifest link -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts Optimization for Ultra-Fast Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Hello Point - Digital Cashbook</title>
    <!-- Built-in Soft Dark Eye-Comfort Theme Initialization -->
    <script>
      (function() {
        try {
          var root = document.documentElement;
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register Service Worker safely, self-healing ghost workers -->
    <script>
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              var reg = regs[i];
              if (reg && reg.active && (reg.active.scriptURL.indexOf('dev-sw') !== -1 || reg.active.scriptURL.indexOf('workbox') !== -1)) {
                reg.unregister();
              }
            }
          }).catch(function() {});

          window.addEventListener('load', function() {
            try {
              navigator.serviceWorker.register('/sw.js')
                .then(function(reg) {
                  try { reg.update(); } catch (e) {}
                })
                .catch(function() {});
            } catch (innerError) {}
          });
        }
      } catch (err) {}
    </script>
  </body>
</html>
